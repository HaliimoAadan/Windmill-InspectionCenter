# fly.toml app configuration file generated for windmill-inspection-center-frontend on 2026-02-27T17:18:22+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'windmill-inspection-center-frontend'
primary_region = 'arn'

[build]
  dockerfile = '.\Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
